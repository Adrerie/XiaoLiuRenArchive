name: Android beta device smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-device-smoke.yml"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "scripts/**"
      - "src/app/**"
      - "src/components/knowledge/**"
      - "src/components/navigation/**"
      - "src/pages/about/**"
      - "src/platform/**"
      - "src/styles/**"

permissions:
  contents: read

jobs:
  device-smoke:
    name: Offline Android beta smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate beta version
        run: npm run validate:version

      - name: Build and sync local Web assets
        run: npm run mobile:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run offline device smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p artifacts/android-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            adb shell am force-stop io.github.adrerie.xiaoliurenarchive
            set +e
            ./android/gradlew connectedDebugAndroidTest --no-daemon
            test_status=$?
            adb logcat -d > artifacts/android-device/logcat.txt || true
            adb exec-out screencap -p > artifacts/android-device/android-device-smoke.png || true
            if grep -E "FATAL EXCEPTION|WebView.*(load|error)|server.url|ERR_INTERNET_DISCONNECTED" artifacts/android-device/logcat.txt; then
              test_status=1
            fi
            exit $test_status

      - name: Upload device smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoliurenarchive-device-smoke-report
          path: |
            artifacts/android-device
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Upload beta debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoliurenarchive-beta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
